name: Generate Daily Tip

on:
  schedule:
    # Run every day at 21:05 UTC (00:05 Israel summer time / midnight)
    - cron: '5 21 * * *'
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions UI

jobs:
  generate-tip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Generate Daily Tip
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_NEW }}
          TZ: "Asia/Jerusalem"
          OLD_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/generate-daily-tip.mjs
          node scripts/generate-daily-features.mjs
          git status
        
      - name: Commit and Push changes
        run: |
          git config --global user.name "TorahBot"
          git config --global user.email "bot@torah-laneshma.org"
          git add app/data/
          # Check if there are changes before committing
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: add automated daily tip" && git push)
