name: Generate Daily Tip

on:
  schedule:
    # Run every day at 00:00 UTC (02:00 or 03:00 Israel time)
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions UI

jobs:
  generate-tip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Generate Daily Tip
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/generate-daily-tip.mjs
          node scripts/generate-daily-features.mjs
        
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data/
          # Check if there are changes before committing
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: add automated daily tip" && git push)
