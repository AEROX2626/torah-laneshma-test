name: Generate Weekly Parasha Article

on:
  schedule:
    # Run every Wednesday at 08:00 UTC
    - cron: '0 8 * * 3'
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions UI

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Parasha Article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_NEW }}
          OLD_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-parasha.mjs

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add app/articles/content.json
          git commit -m "Auto-generate new weekly parasha article"
          git push
