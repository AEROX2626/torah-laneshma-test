<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#258cfb"/>
      <stop offset="100%" stop-color="#0c5bc6"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#06326e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border highlight -->
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="white" stroke-opacity="0.25" stroke-width="1.5" fill="none"/>

  <!-- Neshama Soul Flame / Light of Torah Accent -->
  <path d="M32 9C32 9 35.5 13 35.5 15.5C35.5 17.43 33.93 19 32 19C30.07 19 28.5 17.43 28.5 15.5C28.5 13 32 9 32 9Z" fill="url(#goldGrad)"/>

  <!-- Open Torah Book (Bold, highly legible at 16px tab sizes) -->
  <g filter="url(#glow)">
    <!-- Book Spine & Outlines -->
    <path d="M32 23.5V50M32 23.5C27 19.5 18 19.5 12.5 22.5V47.5C18 44.5 27 44.5 32 48.5M32 23.5C37 19.5 46 19.5 51.5 22.5V47.5C46 44.5 37 44.5 32 48.5" 
          stroke="white" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Torah / Book Page Lines -->
    <path d="M19 29.5C23 28 27 28.5 29 30" stroke="#bfdbfe" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M19 36.5C23 35 27 35.5 29 37" stroke="#bfdbfe" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M45 29.5C41 28 37 28.5 35 30" stroke="#bfdbfe" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M45 36.5C41 35 37 35.5 35 37" stroke="#bfdbfe" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
